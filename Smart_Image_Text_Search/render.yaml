databases:
  - name: scanora-licensing-db
    databaseName: scanora_licensing
    user: scanora_app
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: scanora-licensing-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scanora-licensing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: LICENCE_OFFLINE_GRACE_HOURS
        value: "72"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PUBLIC_BASE_URL
        value: https://new-scanner-zfnp.onrender.com

  - type: web
    name: scanora-admin-dashboard
    runtime: static
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://new-scanner-zfnp.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
